tools:
  - sys__server__sys_mcp_WebFetch
  - firecrawl_scrape_mcp_WebFetch
  - firecrawl_map_mcp_WebFetch
  - firecrawl_search_mcp_WebFetch
  - firecrawl_crawl_mcp_WebFetch
  - firecrawl_check_crawl_status_mcp_WebFetch
  - firecrawl_extract_mcp_WebFetch
  - firecrawl_agent_mcp_WebFetch
  - firecrawl_agent_status_mcp_WebFetch
  - firecrawl_browser_create_mcp_WebFetch
  - firecrawl_browser_execute_mcp_WebFetch
  - firecrawl_browser_delete_mcp_WebFetch
